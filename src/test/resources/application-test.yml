spring:
  main:
    allow-bean-definition-overriding: true

  config:
    activate:
      on-profile: test
  sql:
    init:
      mode: always  # 테스트일 때도 항상 실행
      schema-locations: classpath:schema.sql
  #      data-locations: classpath:popular_review_dummy.sql

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8083