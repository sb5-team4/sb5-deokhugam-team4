spring:
  config:
    activate:
      on-profile: dev
  batch:
    job:
      enabled: false  # 앱 시작 시 자동 실행 안 함
    jdbc:
      initialize-schema: always  # H2에서 테스트용으로만 생성


  datasource:
    # 인메모리 (권장)
    url: jdbc:h2:mem:deokhugam;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create

  h2:
    console:
      enabled: true # 웹 콘솔 활성화
      path: /h2-console # 접속 URL: http://localhost:8080/h2-console

logging:
  level:
    # Hibernate SQL
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.type.descriptor.sql: trace

    # Spring Web
    #    org.springframework.web: trace
    #    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

    # 사용자 package
    com.codeit.deokhugam: debug

server:
  port: 8081
